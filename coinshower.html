/*

JavaScript code begins here. To run this file, simply open the file "coinshower.html"
in your web browser. It relies on the PIXI 2D rendering library, and optionally gsap
for animations. You don't have to use gsap - but it's there if you want to.

Your task is to implement a coin shower animation that are often used during a casino big win.
Using the center of the screen as a starting point, implement coins that "explode" outward.
There should be multiple coins, and gravity should apply to the coins so that they begin by
moving upward, and then move downward.

You can spice up the animation however you want by adding rotation, scaling, simulate
3D coin spinning, etc - the ambition level is up to you. None of this is required - but
it will show that you have a flair for visual presentation.

NOTE: because of how the dependencies are loaded, you have to prefix PIXI functions with e.g
"PIXI.Sprite" instead of just writing "Sprite".

PIXI documentation can be found here:
https://pixijs.download/v8.18.1/docs/index.html

gsap documentation can be found here:
https://gsap.com/docs/v3/

*/

{
    // Speeds are measured in pixels per second.
    const launchVelocityY = -500; // Negative Y moves upward.
    const gravity = 900; // Gravity increases downward speed each second.
    let velocityY = launchVelocityY;
    const spinSpeed = Math.PI * 3; // Radians per second: 1.5 full turns.
    let spinAngle = 0;

    function coinShowerTick(ticker) {
        const deltaSeconds = ticker.deltaMS / 1000;

        // Move the coin, then let gravity change its velocity.
        coin.y += velocityY * deltaSeconds;
        velocityY += gravity * deltaSeconds;

        // A rotating disc looks narrower as it turns away from us.
        spinAngle = (spinAngle + spinSpeed * deltaSeconds) % (Math.PI * 2);
        const faceWidth = Math.abs(Math.cos(spinAngle));
        coin.scale.x = 0.08 + 0.92 * faceWidth; // Keep a thin visible edge.

        // Darken the texture near the edge to suggest changing light.
        const brightness = Math.round(160 + 95 * faceWidth);
        coin.tint = (brightness << 16) | (brightness << 8) | brightness;

        // Launch again once the whole coin has fallen below the screen.
        if (coin.y - coin.height / 2 > app.screen.height) {
            coin.x = app.screen.width / 2;
            coin.y = app.screen.height / 2;
            velocityY = launchVelocityY;
        }
    }

    const app = new PIXI.Application();
    await app.init({ background: '#10a0ff', resizeTo: window });
